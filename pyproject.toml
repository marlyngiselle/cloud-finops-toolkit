[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloud-finops-toolkit"
version = "0.1.0"
description = "Find idle, untagged, oversized and under-licensed Azure resources, and act on them safely."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giselle Da Costa" }]
keywords = ["azure", "finops", "cost-optimization", "resource-graph", "cloud-governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "azure-identity>=1.17",
    "azure-mgmt-compute>=33.0",
    "azure-mgmt-resourcegraph>=8.0",
    "azure-monitor-query>=1.4,<2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
finops = "finops.cli:app"

[project.urls]
Documentation = "https://github.com/marlyngiselle/cloud-finops-toolkit/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/finops"]

[tool.hatch.build.targets.wheel.force-include]
"queries" = "finops/queries"

[tool.hatch.build.targets.sdist]
include = ["src", "queries", "tests", "docs", "examples", "README.md", "LICENSE"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "N",       # naming
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=finops --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["finops"]
omit = ["*/finops/providers/azure.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
