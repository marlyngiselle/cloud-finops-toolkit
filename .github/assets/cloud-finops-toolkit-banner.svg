<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="cloud-finops-toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#2456c8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <!-- spend bars shrinking after clean-up -->
  <g transform="translate(720 0)">
    <rect x="0"   y="70"  width="34" height="190" rx="4" fill="url(#bar)"/>
    <rect x="50"  y="60"  width="34" height="200" rx="4" fill="url(#bar)"/>
    <rect x="100" y="85"  width="34" height="175" rx="4" fill="url(#bar)"/>
    <rect x="150" y="120" width="34" height="140" rx="4" fill="url(#bar)"/>
    <rect x="200" y="150" width="34" height="110" rx="4" fill="url(#bar)"/>
    <rect x="250" y="168" width="34" height="92"  rx="4" fill="url(#bar)"/>
    <rect x="300" y="176" width="34" height="84"  rx="4" fill="url(#bar)"/>
    <rect x="350" y="180" width="34" height="80"  rx="4" fill="url(#bar)"/>
    <path d="M17 70 L67 60 L117 85 L167 120 L217 150 L267 168 L317 176 L367 180" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
    <g fill="#0b1f4d" stroke="#ffffff" stroke-width="3">
      <circle cx="17" cy="70" r="6"/><circle cx="67" cy="60" r="6"/><circle cx="117" cy="85" r="6"/>
      <circle cx="167" cy="120" r="6"/><circle cx="217" cy="150" r="6"/><circle cx="267" cy="168" r="6"/>
      <circle cx="317" cy="176" r="6"/><circle cx="367" cy="180" r="6"/>
    </g>
    <line x1="-10" y1="260" x2="400" y2="260" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <!-- tag and cloud motifs -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <circle cx="1130" cy="60" r="38"/>
    <circle cx="1130" cy="60" r="22"/>
  </g>
  <text x="64" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">cloud-finops-toolkit</text>
  <text x="66" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#dbeafe">Find the Azure spend nobody uses. Act on it safely.</text>
  <text x="66" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#93c5fd">idle · tags · rightsize · hybrid-benefit · schedule</text>
</svg>
